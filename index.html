<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV MAGIC PRO - Studio Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/premium.css">
</head>
<body class="bg-[#0f172a] text-white overflow-hidden h-screen w-screen font-sans">

    <div class="flex flex-col md:flex-row h-full w-full">
        <aside class="w-full md:w-[420px] bg-[#1e293b] border-r border-white/10 p-6 flex flex-col h-full shadow-2xl z-20">
            <div class="mb-6">
                <h2 class="text-2xl font-black text-sky-400 flex items-center gap-2">
                    <i class="fas fa-magic"></i> CV MAGIC STUDIO
                </h2>
                <p class="text-[10px] text-slate-400 uppercase tracking-[0.2em] font-bold">Arsitektur Final 100%</p>
            </div>

            <div class="flex-1 overflow-y-auto space-y-5 pr-2 custom-scroll">
                <div class="space-y-3 bg-[#0f172a]/50 p-4 rounded-xl border border-white/5">
                    <h3 class="text-xs font-bold text-sky-500 uppercase">Informasi Utama</h3>
                    <input type="text" id="in-name" placeholder="Nama Lengkap" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-sm focus:ring-1 focus:ring-sky-500 outline-none">
                    <input type="text" id="in-title" placeholder="Profesi (TTK / Developer)" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-sm focus:ring-1 focus:ring-sky-500 outline-none">
                </div>

                <div class="space-y-3 bg-[#0f172a]/50 p-4 rounded-xl border border-white/5">
                    <h3 class="text-xs font-bold text-sky-500 uppercase">Kontak & Sosial</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="in-email" placeholder="Email" class="bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-[11px] outline-none">
                        <input type="text" id="in-phone" placeholder="WhatsApp" class="bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-[11px] outline-none">
                        <input type="text" id="in-github" placeholder="Github" class="bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-[11px] outline-none">
                        <input type="text" id="in-location" placeholder="Lokasi" class="bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-[11px] outline-none">
                    </div>
                </div>

                <div class="space-y-2">
                    <h3 class="text-xs font-bold text-sky-500 uppercase">Isi Lampiran / Pengalaman</h3>
                    <textarea id="in-content" class="w-full h-64 bg-[#0f172a] border border-slate-700 rounded-xl p-4 text-sm focus:ring-1 focus:ring-sky-500 outline-none resize-none" placeholder="Tulis rincian surat atau pengalaman di sini..."></textarea>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-white/10">
                <button id="btn-pdf" class="w-full bg-sky-500 hover:bg-sky-600 py-4 rounded-xl font-black flex justify-center items-center gap-3 transition-all active:scale-95 shadow-lg shadow-sky-500/20">
                    <i class="fas fa-file-pdf text-xl"></i> DOWNLOAD PDF MASTER
                </button>
            </div>
        </aside>

        <main class="flex-1 bg-[#0f172a] overflow-y-auto p-4 md:p-12 flex justify-center scroll-smooth">
            <div id="cv-preview" class="origin-top">
                <div class="a4-sheet">
                    <header class="border-b-2 border-slate-900 pb-2 mb-4">
                        <div class="flex justify-between items-end">
                            <div>
                                <h1 id="out-name" class="text-4xl font-black text-slate-900 leading-none">IKRAM</h1>
                                <p id="out-title" class="text-sky-600 font-bold text-xs tracking-[0.3em] uppercase mt-1">Tenaga Teknis Kefarmasian & Developer</p>
                            </div>
                            <div class="text-[9px] text-right text-slate-500 font-bold leading-tight">
                                <p id="out-email">EMAIL@EXAMPLE.COM</p>
                                <p id="out-phone">+62 812 XXXX</p>
                                <p id="out-github">GITHUB.COM/USER</p>
                                <p id="out-location">BEKASI, INDONESIA</p>
                            </div>
                        </div>
                    </header>

                    <div id="out-content" class="text-[10.5pt] leading-relaxed text-slate-800 whitespace-pre-wrap">
                        Isi surat atau lampiran Anda akan terupdate secara real-time di sini...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/editor/forms.js"></script>
</body>
</html>
