<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocuMagic | Elite CV Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-[#020617] text-white h-screen overflow-hidden flex flex-col md:flex-row font-sans">

    <div class="md:hidden flex bg-[#0f172a] border-b border-slate-800 z-50 shrink-0">
        <button id="tab-edit" class="flex-1 py-4 text-cyan-400 font-bold border-b-2 border-cyan-400 text-xs tracking-widest"><i class="fas fa-edit mr-2"></i>EDIT</button>
        <button id="tab-view" class="flex-1 py-4 text-slate-500 font-bold border-b-2 border-transparent text-xs tracking-widest"><i class="fas fa-eye mr-2"></i>PREVIEW</button>
    </div>

    <div id="panel-edit" class="w-full md:w-1/3 h-full bg-slate-900 flex flex-col z-10 transition-all md:block">
        <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-[#0f172a] hidden md:flex shrink-0">
            <h1 class="text-xl font-black tracking-widest text-white"><i class="fas fa-magic text-cyan-400 mr-2"></i>DOCU<span class="text-cyan-400">MAGIC</span></h1>
            <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded border border-emerald-500/50">ELITE TIER</span>
        </div>
        <div class="px-6 py-3 bg-[#0f172a] border-b border-slate-800 hidden md:block shrink-0">
            <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1"><span>KEKUATAN CV</span><span id="cv-score-text" class="text-emerald-400">0%</span></div>
            <div class="w-full bg-slate-800 rounded-full h-1.5"><div id="cv-score-bar" class="bg-emerald-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div></div>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar pb-32 md:pb-6">
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <h3 class="text-[10px] font-bold text-cyan-500 uppercase tracking-widest mb-2 border-b border-slate-700 pb-1">Pas Foto</h3>
                    <label class="flex items-center justify-center w-full h-12 transition bg-slate-800 border border-slate-600 border-dashed rounded cursor-pointer hover:border-cyan-500">
                        <i class="fas fa-camera text-slate-400 mr-2"></i><span class="text-xs text-slate-400">Upload</span>
                        <input type="file" id="input-photo" accept="image/*" class="hidden">
                    </label>
                </div>
                <div>
                    <h3 class="text-[10px] font-bold text-cyan-500 uppercase tracking-widest mb-2 border-b border-slate-700 pb-1">Tanda Tangan</h3>
                    <label class="flex items-center justify-center w-full h-12 transition bg-slate-800 border border-slate-600 border-dashed rounded cursor-pointer hover:border-cyan-500">
                        <i class="fas fa-file-signature text-slate-400 mr-2"></i><span class="text-xs text-slate-400">Upload</span>
                        <input type="file" id="input-signature" accept="image/*" class="hidden">
                    </label>
                </div>
            </div>

            <div>
                <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest mb-3 border-b border-slate-700 pb-1">Identitas Inti</h3>
                <input type="text" id="input-name" class="form-input" placeholder="Nama Lengkap">
                <input type="text" id="input-dob" class="form-input mt-2" placeholder="Tempat, Tanggal Lahir">
                <input type="text" id="input-role" class="form-input mt-2" placeholder="Posisi / Profesi">
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <input type="text" id="input-email" class="form-input" placeholder="Email">
                    <input type="text" id="input-phone" class="form-input" placeholder="No. HP">
                    <input type="text" id="input-address" class="form-input col-span-2" placeholder="Alamat Lengkap">
                    <input type="text" id="input-link" class="form-input col-span-2 border-cyan-500/30" placeholder="Link Portofolio (Untuk QR Code)">
                </div>
            </div>

            <div>
                <div class="flex justify-between border-b border-slate-700 pb-1 mb-3"><h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest">Ringkasan Profil</h3><button id="btn-ai-writer" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/50 hover:bg-emerald-500 hover:text-slate-900 transition-all"><i class="fas fa-magic"></i> AI Auto-Write</button></div>
                <textarea id="input-summary" class="form-input h-24 resize-none" placeholder="Deskripsi singkat..."></textarea>
            </div>

            <div>
                <div class="flex justify-between items-center mb-3 border-b border-slate-700 pb-1">
                    <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest">Pengalaman</h3>
                    <button id="btn-add-exp" class="text-xs bg-slate-800 text-cyan-400 px-2 py-1 rounded"><i class="fas fa-plus"></i></button>
                </div>
                <div id="exp-container" class="space-y-4"></div>
            </div>

            <div>
                <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest mb-3 border-b border-slate-700 pb-1">Detail Tambahan</h3>
                <textarea id="input-certifications" class="form-input h-16 resize-none mb-2" placeholder="Lisensi & Sertifikasi (Pisahkan dgn Enter)"></textarea>
                <textarea id="input-projects" class="form-input h-16 resize-none mb-2" placeholder="Proyek & Portofolio (Pisahkan dgn Enter)"></textarea>
                <textarea id="input-skills" class="form-input h-20 resize-none mb-2" placeholder="Keahlian Utama (Pisahkan dgn Enter)"></textarea>
                <textarea id="input-languages" class="form-input h-16 resize-none mb-2" placeholder="Penguasaan Bahasa (Pisahkan dgn Enter)"></textarea>
                <textarea id="input-organizations" class="form-input h-16 resize-none mb-2" placeholder="Pengalaman Organisasi (Pisahkan dgn Enter)"></textarea>
                <textarea id="input-education" class="form-input h-16 resize-none mb-2" placeholder="Riwayat Pendidikan (Pisahkan dgn Enter)"></textarea>
                <textarea id="input-readiness" class="form-input h-16 resize-none border-emerald-500/50" placeholder="Kesiapan Kerja (Pisahkan dgn Enter. Cth: Siap Shift)"></textarea>
            </div>
            
            <div>
                <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest mb-3 border-b border-slate-700 pb-1">Tipografi & Tema</h3>
                <div class="grid grid-cols-3 gap-2 mb-3">
                    <button id="btn-font-modern" class="bg-slate-800 text-white text-xs py-2 rounded border border-slate-600 font-sans">Modern</button>
                    <button id="btn-font-classic" class="bg-slate-800 text-white text-xs py-2 rounded border border-slate-600 font-serif">Classic</button>
                    <button id="btn-font-tech" class="bg-slate-800 text-white text-xs py-2 rounded border border-slate-600 font-mono">Tech</button>
                </div>
                <div class="grid grid-cols-4 gap-2 mb-3">
                    <button id="btn-theme-classic" class="bg-slate-800 hover:bg-slate-700 text-white text-[10px] font-bold py-2 rounded border border-slate-600">CLASSIC</button>
                    <button id="btn-theme-ats" class="bg-slate-800 hover:bg-slate-700 text-white text-[10px] font-bold py-2 rounded border border-slate-600">ATS</button>
                    <button id="btn-theme-pro" class="bg-slate-800 hover:bg-slate-700 text-white text-[10px] font-bold py-2 rounded border border-slate-600">PRO</button>
                    <button id="btn-theme-tech" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 text-[10px] font-bold py-2 rounded border border-cyan-500/50">TECH</button>
                </div>
                <div class="flex items-center justify-between bg-slate-800 px-3 py-2 rounded border border-slate-700">
                    <span class="text-xs font-bold text-slate-300">Warna Aksen:</span>
                    <input type="color" id="input-color" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0">
                </div>
            </div>
        </div>
        
        <div class="p-4 border-t border-slate-800 bg-[#0f172a] fixed md:static bottom-0 left-0 w-full z-20 shrink-0">
            <button id="btn-export" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-black py-3 rounded-lg uppercase tracking-widest transition-all shadow-[0_0_15px_rgba(34,211,238,0.4)]"><i class="fas fa-file-pdf mr-2"></i> Cetak PDF</button>
        </div>
    </div>

    <div id="panel-view" class="hidden md:flex w-full md:w-2/3 h-full bg-slate-800/50 overflow-y-auto justify-center py-6 md:py-10 custom-scrollbar relative pb-32 md:pb-10">
        <div class="absolute top-4 right-8 flex gap-2 z-50">
            <button id="btn-mode-cv" class="bg-cyan-500 text-slate-900 text-xs font-bold px-3 py-1.5 rounded shadow">CV MODE</button>
            <button id="btn-mode-cl" class="bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded border border-slate-600">COVER LETTER</button>
            <button id="btn-lang-toggle" class="bg-indigo-500 text-white text-xs font-bold px-3 py-1.5 rounded shadow ml-4"><i class="fas fa-globe"></i> ID/EN</button>
        </div>
        <div id="cv-paper" class="a4-paper bg-white shadow-2xl flex flex-col overflow-hidden transition-all duration-300"></div>
    </div>

    <script type="module" src="js/core/app.js"></script>
</body>
</html>
