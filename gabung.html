<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Magic | PDF Binder (Penggabung Berkas)</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --c-navy: #0f172a; --c-gold: #d4af37; --c-bg: #f8fafc; --c-border: #e2e8f0; }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--c-navy); color: white; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }

        .container { background: white; color: #333; max-width: 600px; width: 100%; border-radius: 12px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border-top: 5px solid var(--c-gold); height: fit-content; }

        h2 { margin: 0 0 5px 0; color: var(--c-navy); text-transform: uppercase; font-weight: 900; letter-spacing: 1px; }
        p.subtitle { margin: 0 0 20px 0; font-size: 12px; color: #64748b; font-weight: bold; }

        /* Area Upload */
        .upload-area { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 30px 20px; text-align: center; cursor: pointer; transition: 0.3s; background: #f1f5f9; margin-bottom: 20px; }
        .upload-area:hover, .upload-area.dragover { border-color: var(--c-gold); background: #fefce8; }
        .upload-area i { font-size: 40px; color: var(--c-gold); margin-bottom: 10px; }
        .upload-area p { margin: 0; font-size: 13px; font-weight: bold; color: var(--c-navy); }
        .upload-area span { font-size: 11px; color: #64748b; }
        #file-input { display: none; }

        /* List File */
        .file-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .file-item { background: #f8fafc; border: 1px solid var(--c-border); padding: 10px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .file-item.dragging { opacity: 0.5; background: #e2e8f0; border-style: dashed; }

        .file-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .file-icon { font-size: 20px; color: #ef4444; }
        .file-icon.img-icon { color: #3b82f6; }
        .file-name { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
        .file-size { font-size: 10px; color: #64748b; font-weight: bold; }

        .file-actions { display: flex; gap: 5px; }
        .btn-action { background: white; border: 1px solid var(--c-border); border-radius: 4px; padding: 5px 10px; cursor: pointer; color: var(--c-navy); transition: 0.2s; }
        .btn-action:hover { background: var(--c-navy); color: var(--c-gold); }
        .btn-delete { color: #ef4444; border-color: #fca5a5; }
        .btn-delete:hover { background: #ef4444; color: white; border-color: #ef4444; }

        /* Tombol Gabung */
        .btn-merge { width: 100%; background: var(--c-navy); color: var(--c-gold); border: none; padding: 15px; border-radius: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-merge:hover { background: #1e293b; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn-merge:disabled { background: #94a3b8; color: #cbd5e1; cursor: not-allowed; transform: none; box-shadow: none; }

        .loading-spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(212,175,55,0.3); border-radius: 50%; border-top-color: var(--c-gold); animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Navigasi & Copyright */
        .nav-back { display: inline-block; margin-bottom: 20px; color: #cbd5e1; text-decoration: none; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .nav-back:hover { color: var(--c-gold); }
        .copyright { text-align: center; margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--c-border); }
        .copyright p { font-size: 10px; font-weight: bold; color: #64748b; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        .copyright a { color: var(--c-gold); text-decoration: none; transition: 0.3s; }
        .copyright a:hover { color: var(--c-navy); }
    </style>
</head>
<body>

    <div>
        <a href="index.html" class="nav-back"><i class="fas fa-arrow-left"></i> Kembali ke Menu Utama</a>
        <div class="container">
            <h2><i class="fas fa-layer-group text-[var(--c-gold)]"></i> PDF BINDER MAGIC</h2>
            <p class="subtitle">Gabungkan Surat Lamaran, CV, dan Lampiran (KTP/Ijazah) jadi 1 File PDF. Mendukung format .pdf, .jpg, .png.</p>

            <label class="upload-area" id="drop-zone" for="file-input">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Klik disini atau seret file (Drag & Drop)</p>
                <span>Format: PDF, JPG, PNG | Max 10MB/file</span>
            </label>
            <input type="file" id="file-input" multiple accept="application/pdf, image/jpeg, image/png">

            <div class="file-list" id="file-list">
                </div>

            <button class="btn-merge" id="btn-merge" disabled>
                <i class="fas fa-file-pdf" id="btn-icon"></i>
                <div class="loading-spinner" id="spinner"></div>
                <span id="btn-text">GABUNGKAN JADI 1 PDF</span>
            </button>

            <div class="copyright">
                <p>&copy; 2026 <a href="https://ikram-cyber.web.id" target="_blank">IKRAM CYBER SYSTEM</a></p>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const fileListEl = document.getElementById('file-list');
        const btnMerge = document.getElementById('btn-merge');
        const btnText = document.getElementById('btn-text');
        const spinner = document.getElementById('spinner');
        const btnIcon = document.getElementById('btn-icon');

        let filesArray = [];

        // Mencegah default drag & drop browser
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        // Efek visual drag & drop
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        // Handle file drop & klik
        dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files), false);
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files), false);

        function handleFiles(files) {
            const allowedTypes = ['application/pdf', 'image/jpeg', 'image/png'];
            for (let file of files) {
                if (allowedTypes.includes(file.type)) {
                    // Generate ID unik untuk fungsi hapus/pindah
                    const fileObj = { id: Date.now() + Math.random(), file: file };
                    filesArray.push(fileObj);
                } else {
                    alert(`Format tidak didukung: ${file.name}\nHanya menerima PDF, JPG, dan PNG.`);
                }
            }
            fileInput.value = ""; // Reset input
            renderFileList();
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024; const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function renderFileList() {
            fileListEl.innerHTML = "";
            filesArray.forEach((item, index) => {
                const isPdf = item.file.type === 'application/pdf';
                const icon = isPdf ? 'fa-file-pdf' : 'fa-file-image img-icon';
                const colorClass = isPdf ? '' : 'img-icon';

                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `
                    <div class="file-info">
                        <i class="fas ${icon} file-icon ${colorClass}"></i>
                        <div>
                            <div class="file-name" title="${item.file.name}">${item.file.name}</div>
                            <div class="file-size">${formatBytes(item.file.size)} | Urutan: ${index + 1}</div>
                        </div>
                    </div>
                    <div class="file-actions">
                        <button class="btn-action" onclick="moveUp(${index})" ${index === 0 ? 'disabled style="opacity:0.3;cursor:not-allowed;"' : ''} title="Naik"><i class="fas fa-chevron-up"></i></button>
                        <button class="btn-action" onclick="moveDown(${index})" ${index === filesArray.length - 1 ? 'disabled style="opacity:0.3;cursor:not-allowed;"' : ''} title="Turun"><i class="fas fa-chevron-down"></i></button>
                        <button class="btn-action btn-delete" onclick="removeFile('${item.id}')" title="Hapus"><i class="fas fa-times"></i></button>
                    </div>
                `;
                fileListEl.appendChild(div);
            });

            btnMerge.disabled = filesArray.length < 2; // Aktif kalau ada minimal 2 file
            if (filesArray.length === 0) {
                fileListEl.innerHTML = `<div style="text-align:center; padding:10px; color:#94a3b8; font-size:12px; font-weight:bold;">Belum ada berkas.</div>`;
            }
        }

        window.removeFile = (id) => { filesArray = filesArray.filter(f => f.id != id); renderFileList(); };
        window.moveUp = (idx) => { if(idx > 0) { const temp = filesArray[idx]; filesArray[idx] = filesArray[idx-1]; filesArray[idx-1] = temp; renderFileList(); } };
        window.moveDown = (idx) => { if(idx < filesArray.length - 1) { const temp = filesArray[idx]; filesArray[idx] = filesArray[idx+1]; filesArray[idx+1] = temp; renderFileList(); } };

        // MESIN PENGGABUNG (PDF-LIB)
        btnMerge.addEventListener('click', async () => {
            btnMerge.disabled = true;
            btnText.innerText = "MEMPROSES DOKUMEN...";
            spinner.style.display = "block";
            btnIcon.style.display = "none";

            try {
                // Buat dokumen PDF kosong baru
                const mergedPdf = await PDFLib.PDFDocument.create();

                for (let item of filesArray) {
                    const fileBuffer = await item.file.arrayBuffer();

                    if (item.file.type === 'application/pdf') {
                        // Jika PDF, load dan copy semua halamannya
                        const pdfDoc = await PDFLib.PDFDocument.load(fileBuffer);
                        const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
                        copiedPages.forEach((page) => mergedPdf.addPage(page));
                    }
                    else if (item.file.type.startsWith('image/')) {
                        // Jika Gambar (KTP/Ijazah JPG/PNG), embed ke halaman PDF baru (ukuran A4)
                        let image;
                        if (item.file.type === 'image/jpeg') image = await mergedPdf.embedJpg(fileBuffer);
                        else if (item.file.type === 'image/png') image = await mergedPdf.embedPng(fileBuffer);

                        // Ukuran standar A4 (595.28 x 841.89)
                        const page = mergedPdf.addPage([595.28, 841.89]);
                        const { width, height } = page.getSize();

                        // Skala gambar biar pas di A4 tanpa potong (kasih margin 50)
                        const imgDims = image.scaleToFit(width - 100, height - 100);

                        page.drawImage(image, {
                            x: page.getWidth() / 2 - imgDims.width / 2,
                            y: page.getHeight() / 2 - imgDims.height / 2,
                            width: imgDims.width,
                            height: imgDims.height,
                        });
                    }
                }

                // Save dan Download hasilnya
                const pdfBytes = await mergedPdf.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                // Nama file otomatis pakai tanggal
                a.download = `Berkas_Lamaran_Lengkap_${new Date().toISOString().slice(0,10)}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);                         
                
                alert("Boom! Berkas berhasil digabung jadi 1 PDF siap kirim!");                                                                 
            } catch (error) {
                console.error(error);                                             
                alert("Waduh, ada error pas ngegabungin berkas Bos. Pastikan file tidak rusak atau di-password.");
            } finally {                                                           
                btnMerge.disabled = false;
                btnText.innerText = "GABUNGKAN JADI 1 PDF";                       
                spinner.style.display = "none";
                btnIcon.style.display = "inline-block";                       
            }                                                             
        });
    </script>
</body>
</html>
