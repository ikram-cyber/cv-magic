<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV MAGIC - Executive Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/premium.css">
    <style>
        /* CSS INJEKSI UNTUK PREVIEW CV PREMIUM */
        .a4-canvas {
            width: 210mm;
            min-height: 297mm;
            background-color: #ffffff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }
        .font-serif-header { font-family: 'Playfair Display', serif; }
        .text-navy { color: #0f172a; }
        .bg-navy { background-color: #0f172a; }
        .text-gold { color: #d4af37; }
        .bg-gold { background-color: #d4af37; }
        .border-gold { border-color: #d4af37; }

        /* Custom Scrollbar untuk Editor */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }
    </style>
</head>
<body class="overflow-hidden h-screen w-screen flex flex-col bg-[#0b1120]">

    <nav class="bg-[#0f172a] flex text-[10px] md:text-xs font-black tracking-widest z-50 shrink-0 border-b border-[#d4af37]/20">
        <a href="index.html" class="flex-1 text-center py-4 bg-gradient-to-r from-[#b38728] to-[#d4af37] text-black shadow-inner"><i class="fas fa-user-tie"></i> DESAIN CV</a>
        <a href="Slamaran.html" class="flex-1 text-center py-4 text-slate-400 hover:text-[#d4af37] transition border-l border-slate-800"><i class="fas fa-envelope"></i> LAMARAN</a>
        <a href="gabung.html" class="flex-1 text-center py-4 text-slate-400 hover:text-[#d4af37] transition border-l border-slate-800"><i class="fas fa-layer-group"></i> GABUNG BERKAS</a>
    </nav>

    <div class="bg-[#0f172a] p-2 flex shrink-0 md:hidden z-40 border-b border-slate-800">
        <button id="tab-edit" class="flex-1 py-2 bg-[#1e293b] text-[#d4af37] font-bold rounded-lg text-xs border border-[#d4af37]/50 shadow-md">EDITOR CV</button>
        <button id="tab-prev" class="flex-1 py-2 text-slate-400 font-bold text-xs">LIHAT HASIL</button>
    </div>

    <main class="flex-1 flex overflow-hidden relative">

        <section id="panel-editor" class="w-full md:w-[450px] h-full overflow-y-auto p-5 pb-24 border-r border-slate-800 custom-scroll space-y-6 bg-[#0b1120]">

            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-xl font-black text-white tracking-widest"><i class="fas fa-sliders-h text-[#d4af37] mr-2"></i>EDITOR</h2>
                <button id="btn-reset" class="text-[10px] bg-red-900/30 text-red-400 px-3 py-1.5 rounded border border-red-500/30 hover:bg-red-600 hover:text-white transition"><i class="fas fa-trash"></i> RESET</button>
            </div>

            <div class="bg-[#0f172a] p-4 rounded-xl border border-[#d4af37]/20 space-y-4">
                <div>
                    <h3 class="text-[#d4af37] text-[10px] font-black uppercase mb-2 tracking-widest">Warna Aksen Premium</h3>
                    <div class="grid grid-cols-4 gap-2">
                        <button class="cv-theme w-full h-8 rounded bg-[#0f172a] border border-[#d4af37] transition-all" data-theme="theme-navy" title="Navy"></button>
                        <button class="cv-theme w-full h-8 rounded bg-[#d4af37] border-2 border-transparent transition-all" data-theme="theme-gold" title="Gold"></button>
                        <button class="cv-theme w-full h-8 rounded bg-slate-800 border-2 border-transparent transition-all" data-theme="theme-dark" title="Dark Slate"></button>
                        <button class="cv-theme w-full h-8 rounded bg-emerald-700 border-2 border-transparent transition-all" data-theme="theme-emerald" title="Emerald"></button>
                    </div>
                </div>
                <div>
                    <h3 class="text-[#d4af37] text-[10px] font-black uppercase mb-2 tracking-widest">Gaya Tulisan</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="cv-font bg-[#1e293b] text-slate-300 text-[10px] py-2 rounded font-bold border border-transparent transition-all" data-font="font-sans">SANS</button>
                        <button class="cv-font bg-[#1e293b] text-[#d4af37] text-[10px] py-2 rounded font-bold border border-[#d4af37]/50 transition-all" data-font="font-serif">SERIF</button>
                        <button class="cv-font bg-[#1e293b] text-slate-300 text-[10px] py-2 rounded font-bold border border-transparent transition-all" data-font="font-mono">MONO</button>
                    </div>
                </div>
            </div>

            <div class="w-full bg-[#0f172a] p-3 rounded-xl border border-slate-700 text-center relative overflow-hidden group hover:border-[#d4af37]/50 transition">
                <i class="fas fa-camera text-[#d4af37] mb-1 text-lg"></i><p class="text-[10px] font-bold text-slate-300">PAS FOTO PROFIL</p>
                <input type="file" id="cv-photo" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10">
                <button id="btn-remove-photo" class="absolute top-1 right-1 bg-red-600 text-white text-[10px] w-6 h-6 rounded-full z-20 hidden shadow-lg hover:bg-red-500 flex items-center justify-center" title="Hapus Foto"><i class="fas fa-times"></i></button>
            </div>

            <div class="space-y-3 bg-[#0f172a] p-4 rounded-xl border border-slate-800">
                <h3 class="text-[#d4af37] text-[10px] font-black uppercase tracking-widest mb-1">Data Diri</h3>
                <input type="text" id="cv-name" placeholder="Nama Lengkap" class="w-full bg-[#1e293b] text-white p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-[#d4af37]">
                <input type="text" id="cv-title" placeholder="Profesi / Gelar (ex: System Developer)" class="w-full bg-[#1e293b] text-white p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-[#d4af37]">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="cv-ttl" placeholder="Tempat, Tgl Lahir" class="bg-[#1e293b] text-white p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-[#d4af37]">
                    <input type="text" id="cv-port" placeholder="Link Web/Portofolio" class="bg-[#1e293b] text-white p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-[#d4af37]">
                    <input type="text" id="cv-phone" placeholder="No WhatsApp" class="bg-[#1e293b] text-white p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-[#d4af37]">
                    <input type="text" id="cv-email" placeholder="Email" class="bg-[#1e293b] text-white p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-[#d4af37]">
                </div>
                <input type="text" id="cv-address" placeholder="Alamat Domisili" class="w-full bg-[#1e293b] text-white p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-[#d4af37]">
            </div>

            <div class="space-y-3">
                <div class="flex justify-between items-end mb-1">
                    <h3 class="text-[#d4af37] text-[10px] font-black uppercase tracking-widest">Profil Profesional</h3>
                </div>
                <div class="flex gap-2 mb-2">
                    <select id="cv-sel-exp" class="flex-1 bg-[#0f172a] p-2 rounded-lg text-[10px] border border-slate-700 outline-none focus:border-[#d4af37] text-slate-300">
                        <option value="pro">Berpengalaman (Executive)</option>
                        <option value="fresh">Baru Lulus (Fresh Grad)</option>
                        <option value="zero">Belum Pengalaman</option>
                    </select>
                    <button id="btn-gen-profile" class="bg-[#d4af37] hover:bg-[#b38728] text-black px-3 rounded-lg font-bold text-[10px] transition shadow-[0_0_10px_rgba(212,175,55,0.3)]"><i class="fas fa-magic"></i> AUTO</button>
                </div>
                <textarea id="cv-profile" placeholder="Ketik profil eksekutif Anda..." class="w-full h-24 bg-[#0f172a] text-white p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-[#d4af37] resize-none custom-scroll"></textarea>
            </div>

            <div class="space-y-4">
                <div>
                    <h3 class="text-[#d4af37] text-[10px] font-black uppercase tracking-widest mb-2">Keahlian / Skills</h3>
                    <textarea id="cv-skills" placeholder="- Python & Node.js\n- Layanan Kefarmasian" class="w-full h-20 bg-[#0f172a] text-white p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-[#d4af37] resize-none custom-scroll"></textarea>
                </div>
                <div>
                    <h3 class="text-[#d4af37] text-[10px] font-black uppercase tracking-widest mb-2">Lisensi & Sertifikasi</h3>
                    <textarea id="cv-cert" placeholder="- STRTTK Aktif" class="w-full h-16 bg-[#0f172a] text-white p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-[#d4af37] resize-none custom-scroll"></textarea>
                </div>
            </div>

            <div class="space-y-6 bg-[#0f172a] p-4 rounded-xl border border-slate-800">
                <div class="space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                        <h3 class="text-[#d4af37] text-[10px] font-black uppercase tracking-widest">Pengalaman</h3>
                        <button id="btn-add-exp" class="text-[10px] bg-[#d4af37]/10 text-[#d4af37] px-3 py-1 rounded font-bold border border-[#d4af37]/30 hover:bg-[#d4af37] hover:text-black transition">+ TAMBAH</button>
                    </div>
                    <div id="cv-exp-list" class="space-y-2"></div>
                </div>
                <div class="space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                        <h3 class="text-[#d4af37] text-[10px] font-black uppercase tracking-widest">Pendidikan</h3>
                        <button id="btn-add-edu" class="text-[10px] bg-[#d4af37]/10 text-[#d4af37] px-3 py-1 rounded font-bold border border-[#d4af37]/30 hover:bg-[#d4af37] hover:text-black transition">+ TAMBAH</button>
                    </div>
                    <div id="cv-edu-list" class="space-y-2"></div>
                </div>
                <div class="space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                        <h3 class="text-[#d4af37] text-[10px] font-black uppercase tracking-widest">Proyek & Portofolio</h3>
                        <button id="btn-add-prj" class="text-[10px] bg-[#d4af37]/10 text-[#d4af37] px-3 py-1 rounded font-bold border border-[#d4af37]/30 hover:bg-[#d4af37] hover:text-black transition">+ TAMBAH</button>
                    </div>
                    <div id="cv-prj-list" class="space-y-2"></div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-slate-800 pb-8 w-full">
                <button id="btn-export-cv" class="w-full bg-gradient-to-r from-[#b38728] to-[#d4af37] hover:from-[#d4af37] hover:to-[#fcf6ba] text-black font-black py-4 rounded-xl shadow-[0_10px_20px_rgba(212,175,55,0.2)] border border-[#d4af37] flex items-center justify-center gap-3 transition-all active:scale-95 tracking-widest">
                    <i class="fas fa-file-pdf text-xl"></i> DOWNLOAD PDF CV
                </button>
                <div class="w-full text-center mt-6">
                    <p class="text-[10px] font-bold text-slate-500 tracking-[0.2em] uppercase">
                        &copy; 2026 <a href="https://ikram-cyber.web.id" target="_blank" class="text-[#d4af37] hover:text-white transition-all">IKRAM CYBER SYSTEM</a>
                    </p>
                </div>
            </div>
        </section>

        <section id="panel-preview" class="hidden md:flex flex-1 h-full overflow-y-auto bg-[#1e293b] p-8 justify-center custom-scroll pb-24 items-start">
            <div id="capture-area" class="origin-top shadow-2xl transition-all">
                <div id="cv-paper" class="a4-canvas"></div>
            </div>
        </section>
    </main>

    <script src="js/editor/cv.js"></script>
</body>
</html>
