<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DocuMagic | Live CV Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-[#020617] text-white h-screen overflow-hidden flex flex-col md:flex-row font-sans">

    <div class="md:hidden flex bg-[#0f172a] border-b border-slate-800 z-50">
        <button id="tab-edit" class="flex-1 py-4 text-cyan-400 font-bold border-b-2 border-cyan-400 text-xs tracking-widest"><i class="fas fa-edit mr-2"></i>EDIT DATA</button>
        <button id="tab-view" class="flex-1 py-4 text-slate-500 font-bold border-b-2 border-transparent text-xs tracking-widest"><i class="fas fa-eye mr-2"></i>PREVIEW CV</button>
    </div>

    <div id="panel-edit" class="w-full md:w-1/3 h-full bg-slate-900 flex flex-col z-10 transition-all md:block">
        <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-[#0f172a] hidden md:flex">
            <h1 class="text-xl font-black tracking-widest text-white"><i class="fas fa-magic text-cyan-400 mr-2"></i>DOCU<span class="text-cyan-400">MAGIC</span></h1>
            <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded border border-emerald-500/50">V1.0 PRO</span>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar pb-32 md:pb-6">
            <div>
                <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest mb-3 border-b border-slate-700 pb-1">Pas Foto Formal</h3>
                <label class="flex items-center justify-center w-full h-20 px-4 transition bg-slate-800 border-2 border-slate-600 border-dashed rounded-lg appearance-none cursor-pointer hover:border-cyan-500 focus:outline-none">
                    <span class="flex items-center space-x-2">
                        <i class="fas fa-camera text-slate-400"></i>
                        <span class="font-medium text-slate-400 text-sm">Pilih Foto dari Galeri</span>
                    </span>
                    <input type="file" id="input-photo" accept="image/*" class="hidden">
                </label>
            </div>

            <div>
                <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest mb-3 border-b border-slate-700 pb-1">Identitas Inti</h3>
                <input type="text" id="input-name" class="form-input" placeholder="Nama Lengkap">
                <input type="text" id="input-dob" class="form-input mt-2" placeholder="Tempat, Tanggal Lahir">
                <input type="text" id="input-role" class="form-input mt-2" placeholder="Posisi / Profesi">
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <input type="text" id="input-email" class="form-input" placeholder="Email">
                    <input type="text" id="input-phone" class="form-input" placeholder="No. HP">
                    <input type="text" id="input-address" class="form-input mt-2 col-span-2" placeholder="Alamat Lengkap">
                </div>
            </div>

            <div>
                <div class="flex justify-between border-b border-slate-700 pb-1 mb-3"><h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest">Ringkasan Profil</h3><button id="btn-ai-writer" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/50 hover:bg-emerald-500 hover:text-slate-900 transition-all"><i class="fas fa-magic"></i> AI Auto-Write</button></div>
                <textarea id="input-summary" class="form-input h-24 resize-none" placeholder="Deskripsi singkat..."></textarea>
            </div>

            <div>
                <div class="flex justify-between items-center mb-3 border-b border-slate-700 pb-1">
                    <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest">Pengalaman</h3>
                    <button id="btn-add-exp" class="text-xs bg-slate-800 text-cyan-400 px-2 py-1 rounded"><i class="fas fa-plus"></i></button>
                </div>
                <div id="exp-container" class="space-y-4"></div>
            </div>
            
            <div>
            <div>
                <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest mb-3 border-b border-slate-700 pb-1">Keahlian & Pendidikan</h3>
                <textarea id="input-skills" class="form-input h-20 resize-none mb-2" placeholder="Keahlian Utama (Pisahkan dengan Enter)"></textarea>
                <textarea id="input-education" class="form-input h-16 resize-none" placeholder="Riwayat Pendidikan (Pisahkan dengan Enter)"></textarea>
            </div>
                <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest mb-3 border-b border-slate-700 pb-1">Pilih Tema CV</h3>
                <div class="grid grid-cols-4 gap-2">
                    <button id="btn-theme-classic" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2 rounded border border-slate-600">CLASSIC</button>
                    <button id="btn-theme-ats" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2 rounded border border-slate-600">ATS</button>
                    <button id="btn-theme-pro" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2 rounded border border-slate-600">PRO</button>
                    <button id="btn-theme-tech" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-bold py-2 rounded border border-cyan-500/50">TECH</button>
                </div>
            </div>
        </div>
        
        <div class="p-4 border-t border-slate-800 bg-[#0f172a] fixed md:static bottom-0 left-0 w-full z-20">
            <button id="btn-export" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-black py-3 rounded-lg uppercase tracking-widest transition-all shadow-[0_0_15px_rgba(34,211,238,0.4)]">
                <i class="fas fa-file-pdf mr-2"></i> Cetak PDF
            </button>
        </div>
    </div>

    <div id="panel-view" class="hidden md:flex w-full md:w-2/3 h-full bg-slate-800/50 overflow-y-auto justify-center py-6 md:py-10 custom-scrollbar relative pb-32 md:pb-10">
        <div id="cv-paper" class="a4-paper bg-white shadow-2xl flex flex-col overflow-hidden"></div>
    </div>

    <script type="module" src="js/core/app.js"></script>
</body>
</html>
