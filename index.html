<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV MAGIC PRO - Ultimate Melongo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/premium.css">
</head>
<body class="bg-[#0f172a] text-white overflow-hidden h-screen w-screen font-sans">

    <div class="flex flex-col md:flex-row h-full w-full">
        <aside class="w-full md:w-[440px] bg-[#1e293b] border-r border-sky-500/30 p-6 flex flex-col h-full z-20 neon-sidebar">
            <div class="mb-4">
                <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-600 flex items-center gap-2 drop-shadow-[0_0_10px_rgba(14,165,233,0.8)]">
                    <i class="fas fa-bolt text-sky-400"></i> CV MAGIC
                </h2>
                <p class="text-[10px] text-sky-200 uppercase tracking-[0.3em] font-bold mt-1">Ultimate Edition 100%</p>
            </div>

            <div class="flex-1 overflow-y-auto space-y-4 pr-2 custom-scroll pb-20">
                <div class="space-y-2 bg-[#0f172a]/80 p-4 rounded-xl border border-sky-500/20 shadow-[0_0_15px_rgba(0,0,0,0.5)]">
                    <input type="text" id="in-name" placeholder="Nama Lengkap" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-sky-500 outline-none transition">
                    <input type="text" id="in-title" placeholder="Profesi (TTK / Developer)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-sky-500 outline-none transition">
                </div>

                <div class="grid grid-cols-2 gap-2 bg-[#0f172a]/80 p-4 rounded-xl border border-sky-500/20">
                    <input type="text" id="in-email" placeholder="Email" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs outline-none">
                    <input type="text" id="in-phone" placeholder="WhatsApp" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs outline-none">
                    <input type="text" id="in-github" placeholder="Github" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs outline-none">
                    <input type="text" id="in-location" placeholder="Lokasi" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs outline-none">
                </div>

                <div class="bg-[#0f172a]/80 p-4 rounded-xl border border-sky-500/20">
                    <h3 class="text-[10px] font-bold text-sky-400 uppercase mb-2"><i class="fas fa-camera mr-1"></i> Pas Foto Resmi</h3>
                    <input type="file" id="in-photo" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-bold file:bg-sky-500 file:text-white hover:file:bg-sky-600 cursor-pointer transition">
                </div>

                <div class="bg-[#0f172a]/80 p-4 rounded-xl border border-sky-500/20">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-[10px] font-bold text-sky-400 uppercase"><i class="fas fa-pen-nib mr-1"></i> Tanda Tangan</h3>
                        <div class="space-x-1">
                            <button id="btn-rotate-sig" class="text-[9px] bg-slate-700 text-white px-2 py-1 rounded hover:bg-slate-600 transition"><i class="fas fa-sync-alt"></i> Putar</button>
                            <button id="btn-clear-sig" class="text-[9px] bg-red-500/20 text-red-400 px-2 py-1 rounded hover:bg-red-500 hover:text-white transition"><i class="fas fa-trash"></i> Hapus</button>
                        </div>
                    </div>
                    <canvas id="sig-canvas" width="300" height="120" class="w-full bg-white rounded cursor-crosshair touch-none shadow-inner"></canvas>
                </div>

                <div class="bg-[#0f172a]/80 p-4 rounded-xl border border-sky-500/20">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-[10px] font-bold text-sky-400 uppercase"><i class="fas fa-file-alt mr-1"></i> Dokumen</h3>
                        <button id="btn-pagebreak" class="text-[9px] bg-sky-500 text-white px-2 py-1 rounded hover:bg-sky-600 transition flex items-center gap-1">
                            <i class="fas fa-cut"></i> Pisah Halaman
                        </button>
                    </div>
                    <textarea id="in-content" class="w-full h-48 bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:border-sky-500 outline-none resize-none" placeholder="Ketik surat di sini... Klik 'Pisah Halaman' untuk membuat CV di halaman ke-2."></textarea>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-sky-500/30 shrink-0">
                <button id="btn-pdf" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 py-4 rounded-xl font-black text-white flex justify-center items-center gap-3 transition-all active:scale-95 shadow-[0_0_20px_rgba(14,165,233,0.6)]">
                    <i class="fas fa-rocket text-xl"></i> CETAK PDF SULTAN
                </button>
            </div>
        </aside>

        <main class="flex-1 bg-[#090e17] overflow-y-auto p-4 md:p-12 flex justify-center scroll-smooth bg-grid-pattern">
            <div id="cv-preview" class="origin-top transition-transform duration-300">
                <div class="a4-sheet flex flex-col">
                    <header class="border-b-[3px] border-slate-900 pb-3 mb-4 flex justify-between items-start gap-4 shrink-0">
                        <div class="flex-1">
                            <h1 id="out-name" class="text-4xl font-black text-slate-900 leading-none">IKRAM</h1>
                            <p id="out-title" class="text-sky-600 font-bold text-[11px] tracking-[0.2em] uppercase mt-1">Tenaga Teknis Kefarmasian & Developer</p>
                            <div class="text-[9px] text-slate-600 font-bold leading-tight mt-2 flex gap-4">
                                <span id="out-email"><i class="fas fa-envelope text-slate-400"></i> EMAIL@EXAMPLE.COM</span>
                                <span id="out-phone"><i class="fas fa-phone text-slate-400"></i> +62 812 XXXX</span>
                            </div>
                            <div class="text-[9px] text-slate-600 font-bold leading-tight mt-1 flex gap-4">
                                <span id="out-github"><i class="fab fa-github text-slate-400"></i> GITHUB.COM/USER</span>
                                <span id="out-location"><i class="fas fa-map-marker-alt text-slate-400"></i> BEKASI, INDONESIA</span>
                            </div>
                        </div>
                        <div class="w-[30mm] h-[40mm] shrink-0 bg-slate-100 border-2 border-slate-900 rounded overflow-hidden flex items-center justify-center">
                            <img id="out-photo" class="w-full h-full object-cover hidden" alt="Foto">
                            <i id="photo-placeholder" class="fas fa-user-tie text-slate-300 text-3xl"></i>
                        </div>
                    </header>

                    <div id="out-content" class="text-[10.5pt] leading-[1.6] text-slate-800 flex-1">Isi dokumen Anda akan muncul di sini...</div>

                    <div class="mt-6 flex justify-end shrink-0 page-break-inside-avoid">
                        <div class="text-center w-40">
                            <p class="text-[10pt] mb-1">Hormat saya,</p>
                            <div class="h-[25mm] w-full flex items-center justify-center relative">
                                <img id="out-sig" class="max-h-full max-w-full absolute hidden transition-transform duration-300" alt="Tanda Tangan">
                            </div>
                            <p id="out-name-sig" class="text-[10pt] font-bold border-t-2 border-slate-900 pt-1 mt-1">IKRAM</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/editor/forms.js"></script>
</body>
</html>
