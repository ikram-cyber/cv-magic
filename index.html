<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Magic - Professional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/premium.css">
</head>
<body class="bg-slate-900 text-white overflow-hidden h-screen w-screen">

    <div class="flex flex-col md:flex-row h-full w-full">
        <aside class="w-full md:w-[420px] bg-slate-800 border-r border-slate-700 p-6 flex flex-col h-full z-20">
            <h2 class="text-2xl font-black text-sky-400 mb-6"><i class="fas fa-magic"></i> CV MAGIC</h2>

            <div class="flex-1 overflow-y-auto space-y-4 pr-2 custom-scroll">
                <input type="text" id="in-name" placeholder="Nama Lengkap" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm outline-none">
                <input type="text" id="in-title" placeholder="Profesi / Gelar" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm outline-none">
                
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="in-email" placeholder="Email" class="bg-slate-900 border border-slate-700 rounded p-2 text-xs outline-none">
                    <input type="text" id="in-phone" placeholder="WhatsApp" class="bg-slate-900 border border-slate-700 rounded p-2 text-xs outline-none">
                    <input type="text" id="in-github" placeholder="Github" class="bg-slate-900 border border-slate-700 rounded p-2 text-xs outline-none">
                    <input type="text" id="in-location" placeholder="Lokasi" class="bg-slate-900 border border-slate-700 rounded p-2 text-xs outline-none">
                </div>

                <div>
                    <label class="text-xs font-bold text-sky-500 mb-1 block">Pas Foto</label>
                    <input type="file" id="in-photo" accept="image/*" class="w-full text-xs file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-sky-500 file:text-white cursor-pointer">
                </div>

                <div>
                    <label class="text-xs font-bold text-sky-500 mb-1 block">Tanda Tangan</label>
                    <button id="btn-clear-sig" class="text-[10px] bg-red-500 text-white px-2 py-1 rounded mb-1">Hapus TTD</button>
                    <canvas id="sig-canvas" width="300" height="120" class="w-full bg-white rounded cursor-crosshair touch-none"></canvas>
                </div>

                <textarea id="in-content" class="w-full h-40 bg-slate-900 border border-slate-700 rounded p-3 text-sm outline-none resize-none" placeholder="Isi Surat/CV..."></textarea>
            </div>

            <button id="btn-pdf" class="w-full bg-sky-500 hover:bg-sky-600 mt-4 py-3 rounded font-bold transition">
                <i class="fas fa-file-pdf"></i> DOWNLOAD PDF
            </button>
        </aside>

        <main class="flex-1 bg-slate-950 overflow-y-auto p-4 flex justify-center">
            <div id="cv-preview" class="origin-top">
                <div class="a4-sheet flex flex-col">
                    <header class="border-b-2 border-slate-900 pb-3 mb-4 flex justify-between gap-4">
                        <div class="flex-1">
                            <h1 id="out-name" class="text-4xl font-black text-slate-900 leading-none">NAMA</h1>
                            <p id="out-title" class="text-sky-600 font-bold text-xs mt-1 uppercase">PROFESI</p>
                            <div class="text-[9px] text-slate-700 font-bold mt-2 flex gap-3">
                                <span id="out-email">Email</span> | <span id="out-phone">Telepon</span> | 
                                <span id="out-github">Github</span> | <span id="out-location">Lokasi</span>
                            </div>
                        </div>
                        <div class="w-[30mm] h-[40mm] bg-slate-100 border border-slate-300 rounded overflow-hidden flex justify-center items-center">
                            <img id="out-photo" class="w-full h-full object-cover hidden">
                        </div>
                    </header>

                    <div id="out-content" class="text-[10pt] text-slate-800 whitespace-pre-wrap flex-1">Isi dokumen...</div>

                    <div class="mt-6 flex justify-end">
                        <div class="text-center w-40">
                            <p class="text-[10pt] mb-1">Hormat saya,</p>
                            <div class="h-20 flex justify-center items-center">
                                <img id="out-sig" class="max-h-full hidden">
                            </div>
                            <p id="out-name-sig" class="text-[10pt] font-bold border-t border-slate-900 mt-1 pt-1">NAMA</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/editor/forms.js"></script>
</body>
</html>
