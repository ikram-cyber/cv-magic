<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV MAGIC PRO - Ultimate Restoration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/premium.css">
</head>
<body class="bg-[#0f172a] text-white overflow-hidden h-screen w-screen font-sans">

    <div class="flex flex-col md:flex-row h-full w-full">
        <aside class="w-full md:w-[460px] bg-[#1e293b] border-r border-sky-500/30 p-6 flex flex-col h-full z-20 neon-sidebar shadow-2xl">
            <div class="mb-4 border-b border-white/10 pb-4">
                <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-600 flex items-center gap-2 drop-shadow-[0_0_10px_rgba(14,165,233,0.8)]">
                    <i class="fas fa-bolt text-sky-400"></i> CV MAGIC PRO
                </h2>
                <p class="text-xs text-sky-200 font-bold mt-1 uppercase tracking-widest">Master Edition - Stable</p>
            </div>

            <div class="flex-1 overflow-y-auto space-y-6 pr-2 custom-scroll pb-20">
                
                <div class="space-y-3 bg-[#0f172a]/80 p-5 rounded-xl border border-sky-500/20 relative mt-2">
                    <span class="absolute -top-3 left-4 bg-[#1e293b] px-3 py-1 text-[10px] font-black text-sky-400 tracking-widest border border-sky-500/20 rounded-md">1. TEMA & GAYA</span>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] text-slate-400 font-bold mb-1 block">Warna Aksen</label>
                            <select id="sel-theme" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-xs outline-none text-white cursor-pointer">
                                <option value="theme-sky">Sky Blue</option>
                                <option value="theme-emerald">Emerald Green</option>
                                <option value="theme-crimson">Crimson Red</option>
                                <option value="theme-royal">Royal Purple</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 font-bold mb-1 block">Gaya Tulisan</label>
                            <select id="sel-font" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-xs outline-none text-white cursor-pointer">
                                <option value="font-modern">Modern (Inter)</option>
                                <option value="font-classic">Klasik (Serif)</option>
                                <option value="font-mono">Tech (Mono)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="space-y-3 bg-[#0f172a]/80 p-5 rounded-xl border border-sky-500/20 relative mt-4">
                    <span class="absolute -top-3 left-4 bg-[#1e293b] px-3 py-1 text-[10px] font-black text-sky-400 tracking-widest border border-sky-500/20 rounded-md">2. INFORMASI UTAMA</span>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="in-name" placeholder="Nama Lengkap" class="col-span-2 w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm outline-none text-white focus:border-sky-500 transition">
                        <input type="text" id="in-title" placeholder="Profesi / Gelar" class="col-span-2 w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm outline-none text-white focus:border-sky-500 transition">
                        <input type="text" id="in-email" placeholder="Email" class="bg-slate-900 border border-slate-600 rounded-lg p-2 text-xs outline-none text-white">
                        <input type="text" id="in-phone" placeholder="WhatsApp" class="bg-slate-900 border border-slate-600 rounded-lg p-2 text-xs outline-none text-white">
                        <input type="text" id="in-github" placeholder="Github/Portofolio" class="bg-slate-900 border border-slate-600 rounded-lg p-2 text-xs outline-none text-white">
                        <input type="text" id="in-location" placeholder="Lokasi" class="bg-slate-900 border border-slate-600 rounded-lg p-2 text-xs outline-none text-white">
                    </div>
                </div>

                <div class="space-y-3 bg-[#0f172a]/80 p-5 rounded-xl border border-sky-500/20 relative mt-4">
                    <span class="absolute -top-3 left-4 bg-[#1e293b] px-3 py-1 text-[10px] font-black text-sky-400 tracking-widest border border-sky-500/20 rounded-md">3. MEDIA RESMI</span>
                    <label class="text-[10px] text-slate-400 font-bold block mb-1">Pas Foto (Rasio 3x4)</label>
                    <input type="file" id="in-photo" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-1.5 file:px-3 file:rounded file:bg-sky-500 file:text-white cursor-pointer mb-2">
                    
                    <div class="flex justify-between items-end mb-1">
                        <label class="text-[10px] text-slate-400 font-bold block">Tanda Tangan</label>
                        <div class="flex gap-1">
                            <button id="btn-rotate-sig" class="text-[9px] bg-slate-700 px-2 py-1 rounded hover:bg-slate-600 transition font-bold"><i class="fas fa-sync-alt"></i> Putar</button>
                            <button id="btn-clear-sig" class="text-[9px] bg-red-500/20 text-red-400 px-2 py-1 rounded hover:bg-red-500 hover:text-white transition font-bold"><i class="fas fa-trash"></i> Hapus</button>
                        </div>
                    </div>
                    <canvas id="sig-canvas" width="400" height="130" class="w-full bg-white rounded-lg cursor-crosshair touch-none border border-slate-500"></canvas>
                </div>

                <div class="bg-[#0f172a]/80 p-5 rounded-xl border border-sky-500/20 relative mt-4">
                    <span class="absolute -top-3 left-4 bg-[#1e293b] px-3 py-1 text-[10px] font-black text-sky-400 tracking-widest border border-sky-500/20 rounded-md">4. EDITOR KONTEN</span>
                    <div class="flex justify-between mb-2">
                        <button id="btn-template" class="text-[9px] font-bold bg-indigo-500 text-white px-2 py-1 rounded hover:bg-indigo-600 transition">Template Surat</button>
                        <button id="btn-pagebreak" class="text-[9px] font-bold bg-sky-500 text-white px-2 py-1 rounded hover:bg-sky-600 transition">Pisah Halaman</button>
                    </div>
                    <textarea id="in-content" class="w-full h-64 bg-slate-900 border border-slate-600 rounded-lg p-3 text-sm focus:border-sky-500 outline-none text-slate-200 leading-relaxed" placeholder="Ketik surat di sini..."></textarea>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-sky-500/30 shrink-0">
                <button id="btn-pdf" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 py-4 rounded-xl font-black text-white flex justify-center items-center gap-3 transition-all active:scale-95 shadow-lg">
                    <i class="fas fa-print text-xl"></i> CETAK PDF MASTER
                </button>
            </div>
        </aside>

        <main class="flex-1 bg-[#090e17] overflow-y-auto p-4 md:p-12 flex justify-center scroll-smooth bg-grid-pattern">
            <div id="cv-preview" class="origin-top transition-transform duration-300 font-modern theme-sky">
                <div class="a4-sheet flex flex-col">
                    <header class="cv-header border-b-[3px] pb-3 mb-4 flex justify-between items-start gap-4 shrink-0 transition-colors">
                        <div class="flex-1">
                            <h1 id="out-name" class="text-4xl font-black text-slate-900 leading-none cv-text-accent uppercase">NAMA ANDA</h1>
                            <p id="out-title" class="cv-text-accent font-bold text-[11px] tracking-[0.2em] uppercase mt-1">PROFESI ANDA</p>
                            <div class="text-[9px] text-slate-700 font-bold mt-2 flex gap-4">
                                <span id="out-email">email@anda.com</span>
                                <span id="out-phone">+62 XXXX</span>
                                <span id="out-github">github.com/anda</span>
                                <span id="out-location">Bekasi, ID</span>
                            </div>
                        </div>
                        <div class="w-[30mm] h-[40mm] shrink-0 bg-slate-100 border-2 cv-border-accent rounded overflow-hidden flex items-center justify-center relative">
                            <img id="out-photo" class="w-full h-full object-cover hidden absolute z-10">
                            <i id="photo-placeholder" class="fas fa-user-tie text-slate-300 text-3xl"></i>
                        </div>
                    </header>

                    <div id="out-content" class="text-[10.5pt] leading-[1.6] text-slate-800 flex-1 whitespace-pre-wrap">Isi dokumen...</div>

                    <div class="mt-6 flex justify-end shrink-0 page-break-inside-avoid">
                        <div class="text-center w-40">
                            <p class="text-[10pt] mb-1">Hormat saya,</p>
                            <div class="h-[25mm] w-full flex items-center justify-center relative">
                                <img id="out-sig" class="max-h-full max-w-full absolute hidden transition-transform duration-300">
                            </div>
                            <p id="out-name-sig" class="text-[10pt] font-bold border-t-2 cv-border-accent pt-1 mt-1 uppercase">NAMA ANDA</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/editor/forms.js"></script>
</body>
</html>
