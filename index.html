<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMagic | Live CV Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-[#020617] text-white h-screen overflow-hidden flex font-sans">

    <div class="w-1/3 h-full bg-slate-900 border-r border-slate-800 flex flex-col shadow-2xl z-10">
        <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-[#0f172a]">
            <h1 class="text-xl font-black tracking-widest text-white"><i class="fas fa-magic text-cyan-400 mr-2"></i>DOCU<span class="text-cyan-400">MAGIC</span></h1>
            <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded border border-emerald-500/50">AUTO-SAVED</span>
        </div>
        
        <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
            <div>
                <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest mb-3 border-b border-slate-700 pb-1">Identitas Inti</h3>
                <input type="text" id="input-name" class="form-input" placeholder="Nama Lengkap">
                <input type="text" id="input-role" class="form-input mt-2" placeholder="Posisi / Profesi">
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <input type="text" id="input-email" class="form-input" placeholder="Email">
                    <input type="text" id="input-phone" class="form-input" placeholder="No. HP">
                </div>
            </div>

            <div>
                <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest mb-3 border-b border-slate-700 pb-1">Ringkasan Profil</h3>
                <textarea id="input-summary" class="form-input h-24 resize-none" placeholder="Deskripsi singkat..."></textarea>
            </div>

            <div>
                <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest mb-3 border-b border-slate-700 pb-1">Pengalaman</h3>
                <input type="text" id="input-job-title" class="form-input" placeholder="Posisi Jabatan">
                <input type="text" id="input-job-company" class="form-input mt-2" placeholder="Perusahaan">
                <input type="text" id="input-job-date" class="form-input mt-2" placeholder="Periode">
            </div>
            
            <div>
                <h3 class="text-xs font-bold text-cyan-500 uppercase tracking-widest mb-3 border-b border-slate-700 pb-1">Pilih Tema CV</h3>
                <div class="grid grid-cols-3 gap-2">
                    <button id="btn-theme-ats" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2 rounded border border-slate-600">ATS (Formal)</button>
                    <button id="btn-theme-pro" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold py-2 rounded border border-slate-600">PRO (Modern)</button>
                    <button id="btn-theme-tech" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-bold py-2 rounded border border-cyan-500/50">TECH (Matrix)</button>
                </div>
            </div>
        </div>
        
        <div class="p-4 border-t border-slate-800 bg-[#0f172a]">
            <button id="btn-export" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-black py-3 rounded-lg uppercase tracking-widest transition-all shadow-[0_0_15px_rgba(34,211,238,0.4)]">
                <i class="fas fa-file-pdf mr-2"></i> Cetak PDF
            </button>
        </div>
    </div>

    <div class="w-2/3 h-full bg-slate-800/50 overflow-y-auto flex justify-center py-10 custom-scrollbar relative" id="preview-container">
        <div id="cv-paper" class="a4-paper bg-white shadow-2xl flex flex-col overflow-hidden"></div>
    </div>

    <script type="module" src="js/core/app.js"></script>
</body>
</html>
