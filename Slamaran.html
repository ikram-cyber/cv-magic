<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV MAGIC - Surat Lamaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/premium.css">
</head>
<body class="overflow-hidden h-screen w-screen flex flex-col">

    <nav class="bg-slate-900 flex text-xs font-black tracking-widest z-50 shrink-0">
        <a href="index.html" class="flex-1 text-center py-4 text-slate-500 border-b-2 border-slate-800 hover:text-slate-300"><i class="fas fa-user-tie"></i> DESAIN CV</a>
        <a href="Slamaran.html" class="flex-1 text-center py-4 bg-sky-600 text-white shadow-inner"><i class="fas fa-envelope"></i> SURAT LAMARAN</a>
    </nav>

    <div class="bg-slate-800 p-2 flex shrink-0 md:hidden z-40">
        <button id="tab-edit" class="flex-1 py-2 bg-slate-700 text-sky-400 font-bold rounded-lg text-xs border border-slate-600 shadow-md">TULIS SURAT</button>
        <button id="tab-prev" class="flex-1 py-2 text-slate-400 font-bold text-xs">LIHAT HASIL</button>
    </div>

    <main class="flex-1 flex overflow-hidden relative">
        <section id="panel-editor" class="w-full md:w-[450px] h-full overflow-y-auto p-5 pb-24 border-r border-slate-800 custom-scroll space-y-6">
            
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-black text-white">EDITOR SURAT</h2>
                <button id="btn-reset" class="text-[10px] bg-red-500/10 text-red-400 px-2 py-1 rounded border border-red-500/20"><i class="fas fa-trash"></i> RESET DATA</button>
            </div>

            <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-4">
                <div>
                    <h3 class="text-sky-500 text-[10px] font-black uppercase mb-2">Warna Aksen</h3>
                    <div class="grid grid-cols-4 gap-2">
                        <button class="surat-theme w-full h-8 rounded bg-sky-600 border-2 border-transparent" data-theme="theme-sky"></button>
                        <button class="surat-theme w-full h-8 rounded bg-emerald-600 border-2 border-transparent" data-theme="theme-emerald"></button>
                        <button class="surat-theme w-full h-8 rounded bg-red-600 border-2 border-transparent" data-theme="theme-crimson"></button>
                        <button class="surat-theme w-full h-8 rounded bg-purple-600 border-2 border-transparent" data-theme="theme-royal"></button>
                    </div>
                </div>
                <div>
                    <h3 class="text-sky-500 text-[10px] font-black uppercase mb-2">Gaya Tulisan</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button class="surat-font bg-slate-700 text-[10px] py-2 rounded font-bold border border-transparent" data-font="font-sans">SANS (Modern)</button>
                        <button class="surat-font bg-slate-700 text-[10px] py-2 rounded font-bold border border-transparent" data-font="font-serif">SERIF (Formal)</button>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 text-center cursor-pointer" id="btn-open-sig">
                <i class="fas fa-pen-nib text-sky-500 mb-1"></i><p class="text-[10px] font-bold">GAMBAR TANDA TANGAN</p>
            </div>

            <div class="space-y-3">
                <h3 class="text-sky-500 text-[10px] font-black uppercase">Detail Surat</h3>
                <input type="text" id="surat-name" placeholder="Nama Anda" class="w-full bg-slate-800 p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-sky-500">
                <input type="text" id="surat-title" placeholder="Posisi yang dilamar" class="w-full bg-slate-800 p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-sky-500">
                
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="surat-hal" placeholder="Hal (ex: Lamaran Kerja)" class="bg-slate-800 p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-sky-500">
                    <input type="text" id="surat-lamp" placeholder="Lampiran (ex: 1 Berkas)" class="bg-slate-800 p-3 rounded-lg text-sm border border-slate-700 outline-none focus:border-sky-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="surat-date" placeholder="Kota, Tanggal" class="bg-slate-800 p-3 rounded-lg text-sm border border-slate-700 outline-none">
                    <input type="text" id="surat-hrd" placeholder="Yth. HRD / Pimpinan" class="bg-slate-800 p-3 rounded-lg text-sm border border-slate-700 outline-none">
                </div>
                <input type="text" id="surat-comp" placeholder="Nama Perusahaan" class="w-full bg-slate-800 p-3 rounded-lg text-sm border border-slate-700 outline-none">
            </div>

            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-sky-500 text-[10px] font-black uppercase">Isi Surat</h3>
                    <button id="btn-template" class="text-[10px] bg-emerald-600 px-3 py-1 rounded font-bold text-white">TEMPLATE OTOMATIS</button>
                </div>
                <textarea id="surat-content" placeholder="Ketik isi surat lamaran di sini..." class="w-full h-64 bg-slate-800 p-3 rounded-lg text-sm border border-slate-700 outline-none resize-none custom-scroll"></textarea>
            </div>
        </section>

        <section id="panel-preview" class="hidden md:flex flex-1 h-full overflow-y-auto bg-slate-950 p-4 justify-center custom-scroll pb-24">
            <div id="capture-area" class="origin-top shadow-2xl">
                <div id="surat-paper" class="a4-sheet p-[20mm] font-sans text-[11pt] leading-relaxed"></div>
            </div>
        </section>

        <button id="btn-export-surat" class="fixed bottom-4 right-4 left-4 md:left-[470px] bg-sky-500 text-white font-black py-4 rounded-xl shadow-xl z-40 active:scale-95 transition-transform flex items-center justify-center gap-2">
            <i class="fas fa-file-pdf text-xl"></i> DOWNLOAD PDF SURAT
        </button>
    </main>

    <div id="modal-sig" class="fixed inset-0 bg-black/90 z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 w-full max-w-sm rounded-2xl p-4 space-y-4">
            <h3 class="text-sky-400 font-bold text-center text-xs tracking-widest">TANDA TANGAN</h3>
            <canvas id="surat-sig-pad" class="w-full bg-white rounded-xl aspect-video touch-none cursor-crosshair"></canvas>
            <div class="flex gap-2">
                <button id="btn-clear-sig" class="flex-1 bg-red-600 py-3 rounded-lg font-bold text-xs">HAPUS</button>
                <button id="btn-save-sig" class="flex-1 bg-sky-500 py-3 rounded-lg font-bold text-xs">SIMPAN</button>
            </div>
        </div>
    </div>

    <script src="js/editor/surat.js"></script>
</body>
</html>
