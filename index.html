<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV MAGIC PRO - Final Features</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="css/premium.css">
</head>
<body class="bg-[#0f172a] text-white overflow-hidden h-screen w-screen font-sans">

    <div class="flex flex-col md:flex-row h-full w-full">
        <aside class="w-full md:w-[420px] bg-[#1e293b] border-r border-white/10 p-6 flex flex-col h-full shadow-2xl z-20">
            <div class="mb-4">
                <h2 class="text-2xl font-black text-sky-400 flex items-center gap-2">
                    <i class="fas fa-magic"></i> CV MAGIC STUDIO
                </h2>
                <p class="text-[10px] text-slate-400 uppercase tracking-[0.2em] font-bold">Arsitektur Final 100%</p>
            </div>

            <div class="flex-1 overflow-y-auto space-y-4 pr-2 custom-scroll pb-20">
                <div class="space-y-2 bg-[#0f172a]/50 p-4 rounded-xl border border-white/5">
                    <h3 class="text-xs font-bold text-sky-500 uppercase">Informasi Utama</h3>
                    <input type="text" id="in-name" placeholder="Nama Lengkap" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-sm focus:ring-1 focus:ring-sky-500 outline-none">
                    <input type="text" id="in-title" placeholder="Profesi (TTK / Developer)" class="w-full bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-sm focus:ring-1 focus:ring-sky-500 outline-none">
                </div>

                <div class="space-y-2 bg-[#0f172a]/50 p-4 rounded-xl border border-white/5">
                    <h3 class="text-xs font-bold text-sky-500 uppercase">Kontak</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="in-email" placeholder="Email" class="bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-[11px] outline-none">
                        <input type="text" id="in-phone" placeholder="WhatsApp" class="bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-[11px] outline-none">
                        <input type="text" id="in-github" placeholder="Github" class="bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-[11px] outline-none">
                        <input type="text" id="in-location" placeholder="Lokasi" class="bg-[#0f172a] border border-slate-700 rounded-lg p-2 text-[11px] outline-none">
                    </div>
                </div>

                <div class="space-y-2 bg-[#0f172a]/50 p-4 rounded-xl border border-white/5">
                    <h3 class="text-xs font-bold text-sky-500 uppercase">Foto Profil</h3>
                    <input type="file" id="in-photo" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-sky-500 file:text-white hover:file:bg-sky-600 cursor-pointer">
                </div>

                <div class="space-y-2 bg-[#0f172a]/50 p-4 rounded-xl border border-white/5">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-bold text-sky-500 uppercase">Tanda Tangan</h3>
                        <button id="btn-clear-sig" class="text-[10px] bg-red-500/20 text-red-400 px-2 py-1 rounded hover:bg-red-500 hover:text-white transition"><i class="fas fa-trash"></i> Hapus</button>
                    </div>
                    <canvas id="sig-canvas" width="300" height="120" class="w-full bg-white rounded cursor-crosshair border border-slate-700 touch-none"></canvas>
                </div>

                <div class="space-y-2">
                    <h3 class="text-xs font-bold text-sky-500 uppercase">Isi Dokumen</h3>
                    <textarea id="in-content" class="w-full h-40 bg-[#0f172a] border border-slate-700 rounded-xl p-4 text-sm focus:ring-1 focus:ring-sky-500 outline-none resize-none" placeholder="Tulis isi surat/dokumen..."></textarea>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-white/10 shrink-0">
                <button id="btn-pdf" class="w-full bg-sky-500 hover:bg-sky-600 py-4 rounded-xl font-black flex justify-center items-center gap-3 transition-all active:scale-95 shadow-lg shadow-sky-500/20">
                    <i class="fas fa-file-pdf text-xl"></i> DOWNLOAD PDF MASTER
                </button>
            </div>
        </aside>

        <main class="flex-1 bg-[#0f172a] overflow-y-auto p-4 md:p-12 flex justify-center scroll-smooth">
            <div id="cv-preview" class="origin-top">
                <div class="a4-sheet flex flex-col justify-between">
                    <div>
                        <header class="border-b-2 border-slate-900 pb-3 mb-4 flex justify-between items-start gap-4">
                            <div class="flex-1">
                                <h1 id="out-name" class="text-4xl font-black text-slate-900 leading-none">IKRAM</h1>
                                <p id="out-title" class="text-sky-600 font-bold text-[11px] tracking-[0.2em] uppercase mt-1">Tenaga Teknis Kefarmasian & Developer</p>
                                <div class="text-[9px] text-slate-600 font-bold leading-tight mt-2 flex gap-3">
                                    <span id="out-email"><i class="fas fa-envelope"></i> EMAIL@EXAMPLE.COM</span>
                                    <span id="out-phone"><i class="fas fa-phone"></i> +62 812 XXXX</span>
                                </div>
                                <div class="text-[9px] text-slate-600 font-bold leading-tight mt-1 flex gap-3">
                                    <span id="out-github"><i class="fab fa-github"></i> GITHUB.COM/USER</span>
                                    <span id="out-location"><i class="fas fa-map-marker-alt"></i> BEKASI, INDONESIA</span>
                                </div>
                            </div>
                            <div class="w-[30mm] h-[40mm] shrink-0 bg-slate-100 border border-slate-300 rounded overflow-hidden flex items-center justify-center">
                                <img id="out-photo" class="w-full h-full object-cover hidden" alt="Foto Profil">
                                <i id="photo-placeholder" class="fas fa-user text-slate-300 text-3xl"></i>
                            </div>
                        </header>

                        <div id="out-content" class="text-[10.5pt] leading-relaxed text-slate-800 whitespace-pre-wrap">Isi dokumen Anda akan muncul di sini...</div>
                    </div>

                    <div class="mt-10 flex justify-end">
                        <div class="text-center w-40">
                            <p class="text-[10pt] mb-2">Hormat saya,</p>
                            <div class="h-20 w-full flex items-center justify-center">
                                <img id="out-sig" class="max-h-full max-w-full hidden" alt="Tanda Tangan">
                            </div>
                            <p id="out-name-sig" class="text-[10pt] font-bold border-t border-slate-900 pt-1 mt-1">IKRAM</p>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="js/editor/forms.js"></script>
</body>
</html>
